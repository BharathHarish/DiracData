# Retail Analytics semantic layer -- a DEEP, arithmetically-reconciling metric tree (7 levels) plus
# attribution dimensions, every node with pre-defined SQL so RCA is a clean tree-walk for the agent.
#
# Grain: one row per online_purchases line. The PERIOD is applied by the analyst via
#   online_purchases.sale_calendar_day_ref = calendar_days.calendar_day_record  (filter calendar_days.year).
# Every metric SQL is an EXPRESSION over online_purchases (refunds over online_refunds); the analyst
# supplies FROM + the period filter. Ratios use ::DOUBLE + NULLIF to avoid integer/zero-division.
version: 2

business_terms:
  active_online_buyer:
    description: A customer who made at least one ONLINE purchase in the period.
    definition: A distinct online_purchases.billing_client_ref whose sale_calendar_day_ref year is the period.
  first_online_purchase_year:
    description: The earliest year in which a customer made any online purchase.
    definition: MIN(calendar_days.year) over ALL of that billing_client_ref's rows in online_purchases (every year, not just the period).
  new_online_buyer:
    description: An active online buyer whose FIRST-EVER online purchase happened in the period.
    definition: An active_online_buyer in period P whose first_online_purchase_year = P.
  returning_online_buyer:
    description: An active online buyer who had already purchased online in an earlier year.
    definition: An active_online_buyer in period P whose first_online_purchase_year < P.

# ------------------------------------------------------------------------------------------------
# METRICS -- 15 nodes. depends_on = drivers to attribute a change into; decomposition = how they combine
# (multiplicative: parent = childA x childB; additive: parent = childA + childB, refund enters negative).
# ------------------------------------------------------------------------------------------------
metrics:

  # L1 -- TOP
  online_net_revenue:
    description: Online revenue net of refunds -- gross online revenue minus refunded amounts, for the period.
    formula: online_revenue - online_refund_amount   # derived (cross-fact) -- evaluate its drivers, not directly
    decomposition: additive
    depends_on: [online_revenue, online_refund_amount]

  # L2
  online_revenue:
    description: Total online net paid (before refunds) in the period.
    sql: "SUM(online_purchases.net_paid)"
    decomposition: multiplicative
    depends_on: [online_active_buyers, revenue_per_buyer]
  online_refund_amount:
    description: Total amount refunded on online returns in the period (online_refunds.return_amount).
    sql: "SUM(online_refunds.return_amount)"

  # L3
  online_active_buyers:
    description: Distinct customers who purchased online in the period.
    sql: "COUNT(DISTINCT online_purchases.billing_client_ref)"
    decomposition: additive
    depends_on: [new_active_buyers, returning_active_buyers]
  revenue_per_buyer:
    description: Online gross revenue per active buyer.
    formula: online_revenue / online_active_buyers
    sql: "SUM(online_purchases.net_paid)::DOUBLE / NULLIF(COUNT(DISTINCT online_purchases.billing_client_ref), 0)"
    decomposition: multiplicative
    depends_on: [orders_per_buyer, aov]

  # L4
  new_active_buyers:
    description: Active online buyers making their FIRST-EVER online purchase in the period (new_online_buyer).
    sql: "COUNT(DISTINCT CASE WHEN op.billing_client_ref IN (SELECT billing_client_ref FROM online_purchases o2 JOIN calendar_days c2 ON o2.sale_calendar_day_ref=c2.calendar_day_record GROUP BY billing_client_ref HAVING MIN(c2.year) = :period_year) THEN op.billing_client_ref END)"
  returning_active_buyers:
    description: Active online buyers who had already purchased online in an earlier year (returning_online_buyer).
    sql: "COUNT(DISTINCT CASE WHEN op.billing_client_ref IN (SELECT billing_client_ref FROM online_purchases o2 JOIN calendar_days c2 ON o2.sale_calendar_day_ref=c2.calendar_day_record GROUP BY billing_client_ref HAVING MIN(c2.year) < :period_year) THEN op.billing_client_ref END)"
  orders_per_buyer:
    description: Online orders per active buyer (purchase frequency).
    formula: online_orders / online_active_buyers
    sql: "COUNT(DISTINCT online_purchases.order_number)::DOUBLE / NULLIF(COUNT(DISTINCT online_purchases.billing_client_ref), 0)"
  aov:
    description: Average online order value (gross revenue per distinct order).
    formula: online_revenue / online_orders
    sql: "SUM(online_purchases.net_paid)::DOUBLE / NULLIF(COUNT(DISTINCT online_purchases.order_number), 0)"
    decomposition: multiplicative
    depends_on: [units_per_order, avg_selling_price]

  # L5
  units_per_order:
    description: Average units per online order (basket size).
    formula: online_units / online_orders
    sql: "SUM(online_purchases.quantity)::DOUBLE / NULLIF(COUNT(DISTINCT online_purchases.order_number), 0)"
  avg_selling_price:
    description: Average realized selling price per unit (gross revenue per unit sold).
    formula: online_revenue / online_units
    sql: "SUM(online_purchases.net_paid) / NULLIF(SUM(online_purchases.quantity), 0)"
    decomposition: multiplicative
    depends_on: [avg_list_price, price_realization]

  # L6
  avg_list_price:
    description: Average list (pre-discount) price per unit.
    formula: extended_list_amount / online_units
    sql: "SUM(online_purchases.extended_list_price) / NULLIF(SUM(online_purchases.quantity), 0)"
  price_realization:
    description: Fraction of list price actually realized as net revenue (net_paid / extended_list_price).
    formula: online_revenue / extended_list_amount
    sql: "SUM(online_purchases.net_paid) / NULLIF(SUM(online_purchases.extended_list_price), 0)"
    decomposition: multiplicative
    depends_on: [markdown_ratio, coupon_realization]

  # L7 -- leaves
  markdown_ratio:
    description: Fraction of list price kept after markdowns (extended_sales_price / extended_list_price).
    sql: "SUM(online_purchases.extended_sales_price) / NULLIF(SUM(online_purchases.extended_list_price), 0)"
  coupon_realization:
    description: Fraction of marked-down (sales) price kept after coupons/discounts (net_paid / extended_sales_price).
    sql: "SUM(online_purchases.net_paid) / NULLIF(SUM(online_purchases.extended_sales_price), 0)"

  # ==============================================================================================
  # WEB P&L / MARGIN TREE -- a SECOND, distinct 7-level tree rooted at PROFIT (not revenue). It reuses
  # the revenue subtree above (online_revenue, DRY) on one arm and adds a NEW cost/margin arm the
  # revenue tree never touches. NOTE on this dataset: wholesale COGS EXCEEDS net paid, so web margin is
  # NEGATIVE -- a real "this line loses money on COGS; did the loss deepen, and why -- volume or margin?"
  # scenario. Signs are baked into the SQL so every node reconciles with the exact attribution kernels:
  #   web_gross_profit has its OWN sql (used directly), and web_cogs is stored NEGATIVE so the additive
  #   arm profit = revenue + cogs reconciles. net_margin_rate is a RATIO node (profit / revenue).
  #
  #   web_net_profit = online_revenue x net_margin_rate                          [multiplicative]
  #     online_revenue -> [revenue subtree above] ... -> markdown_ratio          (depth 7 on this arm)
  #     net_margin_rate = web_gross_profit / online_revenue                      [ratio]
  #       web_gross_profit = online_revenue + web_cogs                           [additive]
  #         web_cogs  (stored NEGATIVE)
  # ----------------------------------------------------------------------------------------------

  # L1 -- TOP (profit)
  web_net_profit:
    description: Web net profit for the period -- online revenue scaled by the net margin rate (net paid minus wholesale COGS). Negative on this data, since COGS exceeds net paid.
    formula: online_revenue * net_margin_rate
    sql: "SUM(online_purchases.net_paid) - SUM(online_purchases.extended_wholesale_cost)"
    decomposition: multiplicative
    depends_on: [online_revenue, net_margin_rate]

  # L2 (margin arm) -- the ratio node the revenue tree never had
  net_margin_rate:
    description: Net margin rate = web gross profit / online revenue (fraction of revenue kept after wholesale COGS). Negative here because COGS > net paid.
    formula: web_gross_profit / online_revenue
    sql: "(SUM(online_purchases.net_paid) - SUM(online_purchases.extended_wholesale_cost))::DOUBLE / NULLIF(SUM(online_purchases.net_paid), 0)"
    decomposition: ratio
    depends_on: [web_gross_profit, online_revenue]

  # L3 (margin arm)
  web_gross_profit:
    description: Web gross profit = online revenue minus wholesale cost of goods sold, for the period (negative here).
    sql: "SUM(online_purchases.net_paid) - SUM(online_purchases.extended_wholesale_cost)"
    decomposition: additive
    depends_on: [online_revenue, web_cogs]

  # L4 (margin arm) -- leaf, stored NEGATIVE so profit = revenue + cogs reconciles under the additive kernel
  web_cogs:
    description: Web cost of goods sold (wholesale), entered as a NEGATIVE amount so that gross profit = revenue + cogs reconciles (a cost reduces profit).
    sql: "-SUM(online_purchases.extended_wholesale_cost)"

# ------------------------------------------------------------------------------------------------
# TIME -- how to reach the period dimension per fact table, so a tool can assemble the period filter.
# ------------------------------------------------------------------------------------------------
time:
  online_purchases:
    join: "JOIN calendar_days ON online_purchases.sale_calendar_day_ref = calendar_days.calendar_day_record"
    period_column: "calendar_days.year"
  online_refunds:
    join: "JOIN calendar_days ON online_refunds.return_calendar_day_ref = calendar_days.calendar_day_record"
    period_column: "calendar_days.year"
  store_purchases:
    join: "JOIN calendar_days ON store_purchases.sale_calendar_day_ref = calendar_days.calendar_day_record"
    period_column: "calendar_days.year"
  mail_order_purchases:
    join: "JOIN calendar_days ON mail_order_purchases.sale_calendar_day_ref = calendar_days.calendar_day_record"
    period_column: "calendar_days.year"

# ------------------------------------------------------------------------------------------------
# CHANNELS -- the three sales-channel fact tables. Their key columns DIFFER (store has no "billing_"
# prefix and uses ticket_number as the order id) -- use THESE names, do not assume one channel's names
# for another. All join to the same dimensions (calendar_days, merchandise, addresses, household_profiles
# -> income_ranges, client_profiles) via the keys below.
# ------------------------------------------------------------------------------------------------
channels:
  online:
    fact: online_purchases
    order_id: order_number
    client_ref: billing_client_ref
    client_profile_ref: billing_client_profile_ref
    household_ref: billing_household_profile_ref
    address_ref: billing_address_ref
    date_ref: sale_calendar_day_ref
    merchandise_ref: merchandise_ref
    revenue: net_paid
  store:
    fact: store_purchases
    order_id: ticket_number
    client_ref: client_ref
    client_profile_ref: client_profile_ref
    household_ref: household_profile_ref
    address_ref: address_ref
    date_ref: sale_calendar_day_ref
    merchandise_ref: merchandise_ref
    revenue: net_paid
  mail:
    fact: mail_order_purchases
    order_id: order_number
    client_ref: billing_client_ref
    client_profile_ref: billing_client_profile_ref
    household_ref: billing_household_profile_ref
    address_ref: billing_address_ref
    date_ref: sale_calendar_day_ref
    merchandise_ref: merchandise_ref
    revenue: net_paid

# ------------------------------------------------------------------------------------------------
# DIMENSIONS -- attribution slices: a GROUP-BY expression (sql) + the full JOIN fragment to reach it.
# ------------------------------------------------------------------------------------------------
dimensions:
  product_category:
    description: Top-level merchandise category of the purchased item.
    sql: "merchandise.category"
    join: "JOIN merchandise ON online_purchases.merchandise_ref = merchandise.merchandise_record"
  brand:
    description: Brand of the purchased item.
    sql: "merchandise.brand"
    join: "JOIN merchandise ON online_purchases.merchandise_ref = merchandise.merchandise_record"
  income_band:
    description: Household income bracket of the billing household.
    sql: "income_ranges.lower_bound || '-' || income_ranges.upper_bound"
    join: "JOIN household_profiles ON online_purchases.billing_household_profile_ref = household_profiles.household_profile_record JOIN income_ranges ON household_profiles.income_range_ref = income_ranges.income_range_record"
  billing_state:
    description: US state of the billing address.
    sql: "addresses.state"
    join: "JOIN addresses ON online_purchases.billing_address_ref = addresses.address_record"
  gender:
    description: Gender of the billing customer.
    sql: "client_profiles.gender"
    join: "JOIN client_profiles ON online_purchases.billing_client_profile_ref = client_profiles.client_profile_record"
  age_band:
    description: Age/generation cohort of the billing customer, bucketed by birth year (period-independent).
    sql: "CASE WHEN clients.birth_year >= 1980 THEN 'GenY+ (1980+)' WHEN clients.birth_year >= 1965 THEN 'GenX (1965-79)' WHEN clients.birth_year >= 1946 THEN 'Boomer (1946-64)' ELSE 'Silent (<1946)' END"
    join: "JOIN clients ON online_purchases.billing_client_ref = clients.client_record"
  marital_status:
    description: Marital status of the billing customer.
    sql: "client_profiles.marital_status"
    join: "JOIN client_profiles ON online_purchases.billing_client_profile_ref = client_profiles.client_profile_record"
