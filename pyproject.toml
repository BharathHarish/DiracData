[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diracdata"
version = "0.1.0"
description = "Adaptive, verifiable, self-learning, model-agnostic text-to-SQL analytics agent over a multi-engine lakehouse."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "DiracData" }]
keywords = ["text-to-sql", "analytics", "agent", "semantic-layer", "lakehouse", "mcp"]

# Core = the harness spine + the reference engine (DuckDB) + object stores (local/s3).
# Model providers, warehouse engines, MCP, and Postgres/Redis checkpoints are OPTIONAL extras,
# so a minimal install stays small and the open-core boundary is explicit.
dependencies = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
# --- model providers (the factory is provider-agnostic; install what you use) ---
anthropic = ["langchain-anthropic>=1.0", "anthropic>=0.40"]
openai = ["langchain-openai>=1.0", "openai>=2.0"]          # also serves Fireworks (OpenAI-compatible)
aws = ["langchain-aws>=1.0"]
google = ["langchain-google-genai>=4.0"]

# --- object stores (local + s3/minio work in core; these carry the cloud SDKs) ---
azure = ["azure-storage-blob>=12.19"]
gcp = ["google-cloud-storage>=2.16"]

# --- warehouse engines (behind the QueryEngine protocol) ---
postgres = ["psycopg[binary]>=3.1"]
trino = ["trino>=0.328"]
databricks = ["databricks-sql-connector>=3.0"]
snowflake = ["snowflake-connector-python>=3.7"]
redshift = ["redshift-connector>=2.1"]
spark = ["pyspark>=3.5"]

# --- durable checkpointers beyond the object store ---
checkpoints-postgres = ["psycopg[binary]>=3.1"]
checkpoints-redis = ["redis>=5.0"]

# --- the context layer as an MCP server (the GTM wedge) ---
mcp = ["mcp>=1.0"]

# --- the offline learning agent (compiles the governed context) ---
learning = []

all = [
    "diracdata[anthropic,openai,aws,google,azure,gcp,postgres,trino,databricks,snowflake,redshift,spark,mcp,learning]",
]

# [project.scripts] -- a console entry point (diracdata-ask) lands once the CLI moves into the
# package (diracdata.cli); today the CLIs live under scripts/ and run via PYTHONPATH.

[tool.setuptools.packages.find]
where = ["src"]
include = ["diracdata*"]

[tool.setuptools.package-data]
diracdata = ["prompts/*.md"]
