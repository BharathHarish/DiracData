version: 1
metrics:
  online_net_paid_amount:
    version: 1
    review_status: approved
    owner: diracdata_uat
    aliases:
      - online net paid
      - online net paid amount
      - net paid amount
    description: Total net paid value from online purchase line items.
    grain: additive at online purchase line grain before grouping
    sql: SUM(online_purchases.net_paid)
    required_tables:
      - online_purchases
    required_columns:
      - online_purchases.net_paid
    null_semantics:
      - net_paid is additive; NULL handling should be explicit if observed.
    notes:
      - Use this metric only for online purchase revenue unless the user asks for another source.

  online_refund_rate:
    version: 3
    review_status: approved
    owner: diracdata_uat
    updated_at: "2026-06-30"
    aliases:
      - online refund rate
      - refund rate
      - online return rate
      - return rate
      - monetary refund rate
    description: Monetary refund rate for online commerce, calculated as online return amount divided by online net paid amount.
    sql_type: query
    grain: one row per purchased merchandise color after preserving online purchase line grain
    metric_columns:
      - online_refund_rate
    output_columns:
      - merchandise_color
      - online_refund_rate
    expression_sql: COALESCE(SUM(rb.return_amount), 0) / NULLIF(SUM(pb.net_paid), 0)
    sql: |
      WITH purchase_base AS (
          SELECT
              op.order_number,
              op.merchandise_ref,
              op.net_paid,
              m.color AS merchandise_color
          FROM online_purchases op
          JOIN calendar_days purchase_cd
              ON op.sale_calendar_day_ref = purchase_cd.calendar_day_record
          JOIN merchandise m
              ON op.merchandise_ref = m.merchandise_record
          WHERE purchase_cd.fiscal_year = {{purchase_fiscal_year}}
            AND purchase_cd.quarter_of_year = {{purchase_quarter_of_year}}
      ),
      refund_base AS (
          SELECT
              orx.order_number,
              orx.merchandise_ref,
              orx.return_amount
          FROM online_refunds orx
          JOIN calendar_days refund_cd
              ON orx.return_calendar_day_ref = refund_cd.calendar_day_record
          WHERE refund_cd.fiscal_year = {{refund_fiscal_year}}
            AND refund_cd.quarter_of_year = {{refund_quarter_of_year}}
      )
      SELECT
          pb.merchandise_color,
          COALESCE(SUM(rb.return_amount), 0) / NULLIF(SUM(pb.net_paid), 0) AS online_refund_rate
      FROM purchase_base pb
      LEFT JOIN refund_base rb
          ON pb.order_number = rb.order_number
         AND pb.merchandise_ref = rb.merchandise_ref
      GROUP BY pb.merchandise_color
    required_tables:
      - online_purchases
      - online_refunds
    required_columns:
      - online_purchases.order_number
      - online_purchases.merchandise_ref
      - online_purchases.net_paid
      - online_refunds.order_number
      - online_refunds.merchandise_ref
      - online_refunds.return_amount
      - online_refunds.return_calendar_day_ref
      - calendar_days.calendar_day_record
      - calendar_days.fiscal_year
      - calendar_days.quarter_of_year
      - merchandise.merchandise_record
      - merchandise.color
    parameters:
      - name: purchase_fiscal_year
        source: user question purchase date scope
        required: true
      - name: purchase_quarter_of_year
        source: user question purchase date scope
        required: true
      - name: refund_fiscal_year
        source: user question refund date scope
        required: true
      - name: refund_quarter_of_year
        source: user question refund date scope
        required: true
    join_semantics:
      - Start from online_purchases and LEFT JOIN online_refunds so purchases without refunds remain in the denominator.
      - When refund rate is grouped by merchandise attributes, preserve the shared order_number plus merchandise_ref grain between online_purchases and online_refunds.
      - Do not rewrite this metric as an inner join, and do not join refunds to purchases only by order_number.
      - If purchase and refund date scopes are both requested, filter purchase dates through online_purchases.sale_calendar_day_ref and refund dates through online_refunds.return_calendar_day_ref.
    null_semantics:
      - Purchases without matching refunds contribute zero refund amount.
      - Divide by NULLIF(total net paid, 0) so zero-denominator groups return NULL rather than an error.
    notes:
      - Treat this as a full query metric. Instantiate the four placeholders from user wording, but preserve the CTEs, joins, aggregate expression, and output grain unless the user edits the metric definition.
