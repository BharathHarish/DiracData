# Customer-configured semantic layer: business-term idioms, a multi-level METRIC TREE
# (depends_on = drivers), and dimensions. Trusted definitions -- the harness binds to them
# verbatim and decomposes a metric down its tree, and/or across dimensions.
version: 1

# Business-term idioms -- reusable cohort/definition patterns.
business_terms:
  active_online_buyer:
    description: A customer who made at least one ONLINE purchase in the period.
    definition: A distinct online_purchases.billing_client_ref whose sale_calendar_day_ref year is the period.

  # ONLINE cohort split -- the ONLY correct basis for splitting online buyers into new vs
  # returning. Keyed off the customer's FIRST ONLINE PURCHASE (derived from online_purchases
  # itself), NOT clients.first_sale_calendar_day_ref (see warning below).
  first_online_purchase_year:
    description: The earliest year in which a customer made any online purchase.
    definition: MIN(calendar_days.year) over ALL of that billing_client_ref's rows in online_purchases (across every year, not just the period).
  new_online_buyer:
    description: An active online buyer whose FIRST-EVER online purchase happened in the period.
    definition: An active_online_buyer in period P whose first_online_purchase_year = P.
  returning_online_buyer:
    description: An active online buyer who had already purchased online in an earlier year.
    definition: An active_online_buyer in period P whose first_online_purchase_year < P.
  churned_buyer:
    description: A customer active in an earlier period but not active in a later period.
    definition: A client active_online_buyer in period A with NOT EXISTS any online purchase in period B.

  # Company-wide first-sale cohort (ANY channel). Use ONLY for company-level customer questions,
  # NEVER to split online buyers -- a customer's first-ever sale can be in-store, so this does
  # not partition online active buyers (new + returning would not sum to the total).
  new_customer:
    description: A customer whose FIRST-EVER sale (any channel) happened during the period.
    definition: A client whose clients.first_sale_calendar_day_ref year equals the period.
  returning_customer:
    description: A customer whose first-ever sale (any channel) was in an earlier year than the period.
    definition: A client whose clients.first_sale_calendar_day_ref year is before the period.

# METRIC TREE. Leaf metrics have `sql` (compute directly). Composite metrics have `formula`
# (how to compute) and `depends_on` + `decomposition` (how to attribute a change to drivers).
# Top: online_revenue = active_buyers x revenue_per_buyer
#                     = active_buyers x orders_per_buyer x aov
#                     = active_buyers x orders_per_buyer x units_per_order x price_per_unit  (4 levels)
metrics:
  online_revenue:
    description: Total online net paid.
    sql: SUM(online_purchases.net_paid)
    depends_on: [online_active_buyers, revenue_per_buyer]
    decomposition: multiplicative
  revenue_per_buyer:
    description: Online revenue per active buyer.
    formula: online_revenue / online_active_buyers
    depends_on: [orders_per_buyer, aov]
    decomposition: multiplicative
  aov:
    description: Average online order value.
    formula: online_revenue / online_orders
    depends_on: [units_per_order, price_per_unit]
    decomposition: multiplicative

  # leaves (directly computable)
  online_active_buyers:
    description: Distinct customers who purchased online in the period.
    sql: COUNT(DISTINCT online_purchases.billing_client_ref)
    depends_on: [new_active_buyers, returning_active_buyers]   # additive cohort split
    decomposition: additive
    note: >-
      The additive split is by FIRST ONLINE PURCHASE (see new_online_buyer / returning_online_buyer),
      NOT by clients.first_sale_calendar_day_ref. Every online active buyer has a first_online_purchase_year
      <= the period, so new_active_buyers + returning_active_buyers = online_active_buyers EXACTLY. Do not
      use the company-wide first-sale date here -- it counts cross-channel first sales and will not reconcile.
  online_orders:
    description: Number of distinct online orders.
    sql: COUNT(DISTINCT online_purchases.order_number)
  online_units:
    description: Total units sold online.
    sql: SUM(online_purchases.quantity)
  orders_per_buyer:
    description: Orders per active buyer (purchase frequency).
    formula: online_orders / online_active_buyers
  units_per_order:
    description: Average basket size (units per order).
    formula: online_units / online_orders
  price_per_unit:
    description: Average selling price per unit.
    formula: online_revenue / online_units
  new_active_buyers:
    description: Active online buyers making their FIRST-EVER online purchase in the period.
    sql: >-
      COUNT(DISTINCT online_purchases.billing_client_ref) among active online buyers in the period
      whose first_online_purchase_year (MIN calendar year across ALL of that client's online_purchases)
      equals the period.
  returning_active_buyers:
    description: Active online buyers who had already purchased online in an earlier year.
    sql: >-
      COUNT(DISTINCT online_purchases.billing_client_ref) among active online buyers in the period
      whose first_online_purchase_year (MIN calendar year across ALL of that client's online_purchases)
      is before the period.

# Dimensions -- slice axes; all reachable from online_purchases via the join graph (common key).
dimensions:
  category:      merchandise.category (via online_purchases.merchandise_ref)
  billing_state: addresses.state (via online_purchases.billing_address_ref)
  income_band:   income_ranges.lower_bound (via billing_household_profile_ref -> household_profiles)
  gender:        client_profiles.gender (via billing_client_profile_ref)
  cohort:        new_online_buyer vs returning_online_buyer (by first online purchase; see business_terms)
